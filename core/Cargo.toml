[package]
name = "pixelforge-core"
version = "1.0.0"
edition = "2021"
description = "Universal Intelligent Image Compression Studio core and CLI"
license = "MIT"
authors = ["PIXELFORGE"]

[lib]
name = "pixelforge_core"
path = "src/lib.rs"

[[bin]]
name = "pixelforge"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
image = { version = "0.25", features = ["avif", "bmp", "gif", "jpeg", "png", "pnm", "tiff", "webp"] }
kamadak-exif = "0.6"
rayon = "1.11"
rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
blake3 = "1.5"
thiserror = "2.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
walkdir = "2.5"
globset = "0.4"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
half = "2.5"

[dev-dependencies]
tempfile = "3.13"
